spring.application.name=tareas-mongo

# Conexión a MongoDB: dirección del servidor local (puerto 27017 por defecto) y nombre de la
# base de datos, tareas. No lleva usuario ni contraseña porque la instalación local de
# MongoDB no tiene la autenticación activada. La base de datos no hay que crearla: MongoDB
# la crea al guardar el primer documento.
spring.mongodb.uri=mongodb://localhost:27017/tareas

server.port = 8082
